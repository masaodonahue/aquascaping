<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aquascape Log</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ground: #F6F5F1;
    --surface: #FFFFFF;
    --line: #E7E5DE;
    --line-soft: #EFEDE7;

    --ink: #16181A;
    --body: #3A3F40;
    --muted: #9A9992;

    --good: #4A8B6A;
    --good-tint: #E8F1EA;
    --warn: #B5813A;
    --warn-tint: #FAF0DE;

    --serif: "Newsreader", Georgia, serif;
    --sans: "Zen Kaku Gothic New", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 18px; --s5: 28px;
    --r: 16px; --r-sm: 10px;
    --shadow: 0 1px 2px rgba(22,24,26,.03), 0 1px 12px rgba(22,24,26,.04);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--good); outline-offset: 3px; border-radius: 3px; }

  .app { max-width: 440px; margin: 0 auto; padding: var(--s4) var(--s4) 104px; }

  /* page head */
  .pagehead { margin-bottom: var(--s4); }
  .pagehead h1 {
    font-family: var(--serif); font-weight: 500; font-size: 30px;
    letter-spacing: -.01em; margin: 0; color: var(--ink);
  }
  .pagehead .sub { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: var(--s1); }
  .pagehead .top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s3); }
  .datechip {
    font-family: var(--mono); font-size: 12px; color: var(--body);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; background: var(--surface); white-space: nowrap;
  }
  .backlink {
    background: none; border: none; padding: 0 0 var(--s3);
    font-size: 14px; color: var(--good); display: flex; align-items: center; gap: 6px;
  }

  /* group label */
    .grouplabel {
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted);
    margin: var(--s3) 0 var(--s2);
  }
  .grouplabel:first-of-type { margin-top: 0; }

  /* list rows */
  .rowcard {
    width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--shadow);
    margin-bottom: var(--s2);
    display: flex; align-items: stretch;
    position: relative; overflow: hidden;
    transition: border-color .15s;
  }
  .rowmain {
    flex: 1; min-width: 0; background: none; border: none; text-align: left;
    padding: var(--s3); display: flex; align-items: center; gap: var(--s3);
  }
  .rowacts { display: flex; align-items: center; gap: var(--s1); padding-right: var(--s2); }
  .rowacts .act {
    background: var(--good-tint); border: none; border-radius: 10px;
    width: 36px; height: 36px; display: grid; place-items: center; color: var(--good);
  }
  .rowacts .act svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .rowcard.attention .act { background: #F4E8D2; color: var(--warn); }
  .rowcard:hover { border-color: #D9D6CD; }
  .rowcard.attention { background: var(--warn-tint); border-color: #EBDCC0; }

  .icontile {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 11px;
    background: var(--good-tint); color: var(--good);
    display: grid; place-items: center;
  }
  .icontile svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .rowcard.attention .icontile { background: #F4E8D2; color: var(--warn); }

  .rowbody { flex: 1; min-width: 0; }
  .rowbody .name { font-size: 16px; font-weight: 500; color: var(--ink); }
  .rowbody .latin { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--muted); }
  .rowbody .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rowdesc { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 2px; }

  .pills { display: flex; gap: 6px; flex: 0 0 auto; }
  .statuspill {
    font-family: var(--mono); font-size: 11px; padding: 4px 9px; border-radius: 999px;
    background: var(--good-tint); color: var(--good); white-space: nowrap;
  }
  .statuspill.late { background: #F4E8D2; color: var(--warn); }

  .meter { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--line-soft); }
  .meter i { display: block; height: 100%; background: var(--good); }
  .meter i.late { background: var(--warn); }

  /* detail blocks */
  .block { margin-bottom: var(--s3); }
  .block h2 {
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted); font-weight: 400;
    margin: 0 0 var(--s2);
  }
    .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--shadow); padding: var(--s2) var(--s4);
  }
  .kv { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); padding: 6px 0; font-size: 14px; }
  .kv + .kv { border-top: 1px solid var(--line-soft); }
  .kv span:last-child { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .kv.late span:last-child { color: var(--warn); }
  .empty { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3) var(--s3); }
  .grid2 .lab {
    font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px;
  }
  .grid2 .val { font-size: 14px; color: var(--ink); }

  /* the water figure — small, inside the tank view */
    .waterfig {
    position: relative; overflow: hidden; height: 78px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--shadow);
    padding: 0 var(--s4); margin-bottom: var(--s4);
    display: flex; align-items: center; gap: var(--s3);
  }
  .waterfig .num { font-family: var(--serif); font-size: 36px; line-height: 1; font-weight: 500; position: relative; }
  .waterfig .cap { font-family: var(--mono); font-size: 12px; color: var(--muted); position: relative; }
  .water { position: absolute; left: 0; right: 0; bottom: 0; background: #DCEAE2; transition: height .6s cubic-bezier(.4,0,.2,1); }
  .water.late { background: #F5E7CE; }
  .wave { position: absolute; top: -8px; left: 0; width: 200%; height: 9px; display: block; animation: drift 12s linear infinite; }
  @keyframes drift { to { transform: translateX(-50%); } }

  /* history */
  .searchbar { margin-bottom: var(--s2); }
  .searchbar input {
    width: 100%; background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 11px 18px;
    font-family: var(--sans); font-size: 14px; color: var(--ink);
  }
  .pillrow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: var(--s1); margin-bottom: var(--s3); }
  .pillrow button {
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .pillrow button[aria-pressed="true"] { color: var(--good); border-color: var(--good); background: var(--good-tint); }

  .daylabel { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: var(--s4) 0 var(--s2); }
  .daylabel:first-child { margin-top: 0; }
  .entry {
    display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 9px 0; font-size: 14px;
  }
  .entry + .entry { border-top: 1px solid var(--line-soft); }
  .entryhead { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); }
  .entry .note { color: var(--muted); font-size: 13px; }
  .entry .when { font-family: var(--mono); font-size: 11px; color: var(--muted); flex: 0 0 auto; }

  .sheetlink {
    background: none; border: none; padding: 0; color: var(--muted);
    font-family: var(--mono); font-size: 12px;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .sheetlink:hover { color: var(--ink); }

  /* tab bar */
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(246,245,241,.94);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); display: flex; justify-content: center; z-index: 40;
  }
  .tabbar .inner { display: flex; width: 100%; max-width: 440px; }
  .tabbar button {
    flex: 1; background: none; border: none;
    padding: 10px 4px calc(12px + env(safe-area-inset-bottom, 0px));
    font-size: 11px; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tabbar svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar button[aria-current="page"] { color: var(--good); }

  /* modals */
  .scrim {
    position: fixed; inset: 0; background: rgba(22,24,26,.3);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .scrim[hidden] { display: none; }
  .modal {
    background: var(--ground); border-radius: 22px 22px 0 0; width: 100%; max-width: 440px;
    max-height: 90vh; overflow-y: auto; padding: var(--s4) var(--s4) var(--s5);
    animation: rise .24s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes rise { from { transform: translateY(18px); opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .modal { animation: none; } .wave { animation: none; } .water { transition: none; } }
  .modal h2 { font-family: var(--serif); font-weight: 500; font-size: 28px; margin: 0 0 2px; }
  .modal .sub { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0 0 var(--s4); }

  .field { margin-bottom: var(--s3); }
  .field > label, .field > .lab {
    display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: var(--s2);
  }
  input[type=text], input[type=number], input[type=time], input[type=datetime-local], textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-sm); color: var(--ink);
    font-family: var(--sans); font-size: 15px; padding: 12px 14px;
  }
  textarea { min-height: 76px; resize: vertical; }

  .slider-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--s1); }
  .slider-head .lab { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .slider-val { font-family: var(--serif); font-size: 28px; font-weight: 500; line-height: 1.1; }
  input[type=range] { width: 100%; accent-color: var(--good); background: transparent; margin: var(--s1) 0 0; }
  .slider-scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 15px; font-size: 14px; color: var(--body);
    transition: color .14s, border-color .14s, background-color .14s;
  }
  .chip[aria-pressed="true"] { color: var(--good); border-color: var(--good); background: var(--good-tint); }
  .chip.flag[aria-pressed="true"] { color: var(--warn); border-color: var(--warn); background: var(--warn-tint); }

  .switches { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); margin-bottom: var(--s3); }
  .switch {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: var(--s3) var(--s2); display: flex; flex-direction: column; align-items: center; gap: var(--s2);
    color: var(--muted); transition: border-color .15s, color .15s, background-color .15s;
  }
  .switch svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .switch b { font-weight: 400; font-size: 13px; }
  .switch[aria-pressed="true"] { color: var(--good); border-color: var(--good); background: var(--good-tint); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s3) var(--s4); margin-bottom: var(--s4); }
  .panel > .lab { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: var(--s2); }
  .timepair { margin-bottom: var(--s3); }
  .timepair > .lab {
    display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: var(--s1);
  }
  .timepair .cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
  .timepair label {
    display: block; font-family: var(--mono); font-size: 11px;
    color: var(--muted); margin-bottom: 2px;
  }
  .danger {
    width: 100%; background: none; border: 1px solid #E4CFCB;
    color: #A8544A; border-radius: var(--r-sm); padding: 13px; font-size: 14px;
  }
  .toggle { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) 0; border-top: 1px solid var(--line); font-size: 14px; cursor: pointer; }
  .toggle:last-of-type { border-bottom: 1px solid var(--line); }
  .toggle input { width: 18px; height: 18px; accent-color: var(--good); margin: 0; }
  .toggle .hint { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .slider-nested { padding: 0 0 var(--s2) var(--s5); }
  .winrow { display: flex; justify-content: space-between; gap: var(--s3); padding: 5px 0; font-size: 14px; }
  .winrow span:last-child { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .locked { display: flex; align-items: center; justify-content: space-between; margin-top: var(--s2); }
  .locked em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .mathline { font-family: var(--mono); font-size: 11px; color: var(--muted); margin: var(--s2) 0 0; }
  .mathline.off { color: var(--warn); }

  .swatches { display: flex; gap: var(--s1); }
  .swatch { flex: 1; aspect-ratio: 1 / 1.4; border: 2px solid transparent; border-radius: 8px; position: relative; padding: 0; min-width: 0; }
  .swatch[aria-pressed="true"] { border-color: var(--ink); }
  .swatch span { position: absolute; left: 0; right: 0; bottom: -18px; font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: center; }
  .swatch[aria-pressed="true"] span { color: var(--ink); }
  .swatch-row { margin-bottom: var(--s5); }

  .picker { display: flex; gap: var(--s2); }
  .picker button { flex: 1; background: none; border: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: var(--s2); }
  .picker .blob { width: 100%; aspect-ratio: 1; max-width: 56px; border-radius: 50%; border: 3px solid transparent; transition: transform .15s; }
  .picker button:hover .blob { transform: scale(1.04); }
  .picker button[aria-pressed="true"] .blob { border-color: var(--ink); }
  .picker b { font-weight: 500; font-size: 12px; text-align: center; line-height: 1.2; }
  .picker i { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: center; }

  .caution { background: var(--warn-tint); border-radius: var(--r-sm); padding: 12px 14px; font-size: 13px; color: #7C5A22; margin-bottom: var(--s4); }
  .caution strong { color: #66491A; font-weight: 500; }

  .modal-actions { display: flex; gap: var(--s2); margin-top: var(--s4); }
  .modal-actions .save { flex: 1; background: var(--good); color: #fff; border: none; border-radius: var(--r-sm); padding: 16px; font-weight: 500; font-size: 15px; }
  .modal-actions .cancel { background: none; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 16px 22px; color: var(--muted); }

  table.rows { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 10px; }
  table.rows th { text-align: left; color: var(--muted); font-weight: 400; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.rows td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line-soft); color: var(--muted); white-space: nowrap; }
  table.rows td:nth-child(3), table.rows td:nth-child(5) { color: var(--ink); }
  .scroller { overflow-x: auto; }

  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px;
    font-size: 13px; z-index: 90;
  }
  .toast[hidden] { display: none; }
  .toast .undo { background: none; border: none; padding: 0; margin-left: 14px; color: #A8D8BE; font-weight: 500; text-decoration: underline; }

  .loading { font-family: var(--mono); color: var(--muted); font-size: 12px; padding: var(--s5) 0; }
  .gate { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: var(--s5) var(--s4); text-align: center; margin-top: var(--s5); }
  .gate h2 { font-family: var(--serif); font-weight: 500; font-size: 28px; margin: 0 0 var(--s1); }
  .gate p { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0 0 var(--s4); }
  .gate .btn { display: flex; justify-content: center; }
  .gate .err { color: var(--warn); }
  .paused-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: var(--s4); }
  .paused-card h2 { font-family: var(--serif); font-weight: 500; font-size: 24px; margin: 0 0 var(--s1); }
  .paused-card p { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0; }
  .openbanner { background: var(--warn-tint); color: #7C5A22; border-radius: var(--r-sm); padding: 10px 14px; font-family: var(--mono); font-size: 11px; margin-bottom: var(--s3); }
  .primary { width: 100%; background: var(--good); color: #fff; border: none; border-radius: var(--r-sm); padding: 16px; font-size: 15px; }
</style>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<div class="app" id="app"><p class="loading">Loading…</p></div>
<nav class="tabbar" id="tabs" aria-label="Sections"></nav>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";

  // Fetched from /api/config at boot, so it lives only in Vercel's env vars.
  var CLIENT_ID = "";
  var AUTH_ON = false;
  var TOKEN_KEY = "aqualog:idt";

  var idToken = null;

  var UI_KEY = "aqualog:ui";
  var QUEUE_KEY = "aqualog:queue";
  var DAY = 86400000;
  var NS = "http://www.w3.org/2000/svg";

  /* ================= reference data ================= */

  var API = {
    ammonia: { steps: [0, 0.25, 0.5, 1, 2, 4, 8],
      colors: ["#E8DC7A","#D6DC72","#B6D06E","#8CC06B","#5FA968","#3D8A5E","#2A6B4E"] },
    nitrite: { steps: [0, 0.25, 0.5, 1, 2, 5],
      colors: ["#8FC6D4","#B9A8C6","#C286B4","#B85C97","#9C3874","#6E1F4E"] },
    nitrate: { steps: [0, 5, 10, 20, 40, 80, 160],
      colors: ["#F0D96B","#EFC05C","#EC9E4E","#E37A44","#D4553C","#B33A32","#8A2726"] }
  };

  var BEHAVIOR = [
    { id: "normal", label: "Normal" },
    { id: "full_column", label: "Using full column" },
    { id: "approaching", label: "Approaching glass" },
    { id: "hiding", label: "Hiding", flag: true },
    { id: "surface", label: "Surface-hanging", flag: true },
    { id: "gasping", label: "Gasping", flag: true },
    { id: "pale", label: "Pale", flag: true },
    { id: "shrimp_out", label: "Shrimp climbing out", flag: true }
  ];

  // Ordered by rising CO2. Bromothymol blue shifts hue, not lightness, so
  // these are hue steps — a pale green and a deep green read the same.
  var CHECKER = [
    { id: "blue", label: "Blue", hint: "too little", color: "#4C8FC9" },
    { id: "blue_green", label: "Blue-green", hint: "coming up", color: "#4FA6A8" },
    { id: "green", label: "Green", hint: "in range", color: "#57B27F" },
    { id: "yellow_green", label: "Yellow-green", hint: "edge of high", color: "#A8C254" },
    { id: "yellow", label: "Yellow", hint: "too much", color: "#EFC24F" }
  ];

  var MAINTENANCE = [

  /* ---- rows back into entries ---- */

  function numish(v) {
    if (v === "" || v === null || v === undefined) return v;

  }

  function absorb(e, r) {
    var m = String(r.metric), v = r.value;
    if (e.kind === "water_change") {
      if (m === "percent") e.data.percent = numish(v);
      else if (m === "refill") e.data.refill_l = numish(v);
      else if (m === "glass") e.data.glass = true;
    } else if (e.kind === "dose") {
      e.data.product = m; e.data.amount = numish(v); e.data.unit = r.unit;
    } else if (e.kind === "test") {
      e.data[m] = numish(v);
    } else if (e.kind === "checker") {
      if (m === "drop_checker") {
        e.data.checker = v;
        e.data.hour = Number(String(r.unit).replace("hour_", "")) || 0;
      } else if (m === "co2_elapsed") e.data.co2 = numish(v);
      else if (m === "light_elapsed") e.data.light = numish(v);
    } else if (e.kind === "observation") {
      if (m === "behavior" && v) e.data.behavior = String(v).split("|");
      else if (m.indexOf("affected_") === 0) { e.data.species = m.slice(9); e.data.count = numish(v); }
      if (!e.data.behavior) e.data.behavior = [];
    } else if (e.kind === "maintenance") {
      e.data.task = v;
    } else if (e.kind === "livestock" || e.kind === "plant") {
      var i = m.indexOf("_");
      e.data.event = m.slice(0, i);
      e.data.species = m.slice(i + 1);
      e.data.count = numish(v);
    } else if (e.kind === "setting") {
      e.data.setting = m;
      e.data.value = (r.unit === "time" || r.unit === "ml_per_l") ? String(v) : numish(v);
      e.data.unit = r.unit;
    }
  }

  function fromRows(rows) {
    var byEvent = {}, order = [];
    rows.forEach(function (r) {
      if (!r.ts || !r.tank) return;
      // Entry ID is the grouping key. Rows written before that column existed
      // fall back to a composite — and for kinds where one row is one event,
      // the metric has to be part of it or separate events merge.
      var multi = ["water_change", "test", "checker", "observation"].indexOf(r.type) !== -1;
      var key = r.id ? r.id
        : r.ts + "|" + r.tank + "|" + r.type + (multi ? "" : "|" + r.metric);
      if (!byEvent[key]) {
        byEvent[key] = { id: r.id || key, ts: r.ts, tank: r.tank, kind: r.type, data: {}, note: r.note || "" };
        order.push(key);
      }
      if (r.note && !byEvent[key].note) byEvent[key].note = r.note;
      absorb(byEvent[key], r);
    });
    var entries = order.map(function (k) { return byEvent[k]; });

    var tanks = [], seen = {};
    entries.forEach(function (e) {
      if (seen[e.tank]) return;
      seen[e.tank] = true;
      tanks.push({ id: e.tank, name: e.tank, status: "running" });
    });
    entries.forEach(function (e) {
      if (e.kind !== "setting") return;
      var t = tanks.filter(function (x) { return x.id === e.tank; })[0];
      if (!t) return;
      if (e.data.setting === "tank_name") t.name = String(e.data.value);
      if (e.data.setting === "tank_status") t.status = String(e.data.value);
    });
    if (!tanks.length) tanks.push({ id: "t1", name: "Tank 1", status: "running" });

    return { tanks: tanks, active: tanks[0].id, tab: "home", view: "list", entries: entries };
  }

  /* ================= helpers ================= */

  function $(s, r) { return (r || document).querySelector(s); }
  function el(tag, cls, text) {

  function settingValue(tankId, key, fallback, asOf) {
    var e = lastEntry(tankId, function (x) {
      return x.kind === "setting" && x.data.setting === key;
    }, asOf);
    return e ? e.data.value : fallback;
  }
  function schedule(tankId, asOf) {
    return {

      co2Off: settingValue(tankId, "co2_off", "", asOf),
      lightOn: settingValue(tankId, "light_on", "", asOf),

  }

  }

  function toLocal(iso) {

    return d.toISOString().slice(0, 16);
  }

  var toastTimer;
  function toast(msg, onUndo) {
    var t = $("#toast");
    t.innerHTML = "";
    t.appendChild(document.createTextNode(msg));
    if (onUndo) {
      var b = el("button", "undo", "Undo");
      b.onclick = function () { t.hidden = true; clearTimeout(toastTimer); onUndo(); };
      t.appendChild(b);
    }
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, onUndo ? 5000 : 2600);
  }

  function replaceEntry(entry, msg) {
    state.entries = state.entries.filter(function (e) { return e.id !== entry.id; }).concat([entry]);
    closeModal();
    render();
    postRows(toRows(entry), "replace", entry.id)
      .then(function () { toast(msg); })
      .catch(function () { toast("Saved on device — will sync."); });
  }

  function removeEntry(entry) {
    state.entries = state.entries.filter(function (e) { return e.id !== entry.id; });
    closeModal();
    render();
    postRows([], "delete", entry.id)
      .then(function () { toast("Deleted."); })
      .catch(function () { toast("Couldn't delete — reload and try again."); });
  }

  function commit(entries, msg) {
    state.entries = state.entries.concat(entries);
    closeModal();

    postRows(rows)
      .then(function () { toast(msg); })
      .catch(function () {

  }

  function svgNode(parts, cls) {

      } else if (p.e) {
        n = document.createElementNS(NS, "ellipse");
        n.setAttribute("cx", p.e[0]); n.setAttribute("cy", p.e[1]);
        n.setAttribute("rx", p.e[2]); n.setAttribute("ry", p.e[3]);

  /* ================= rosters ================= */

  function rosterOf(tankId, kind) {
    var counts = {};
    tankEntries(tankId).slice().reverse().forEach(function (e) {
      if (e.kind !== kind) return;
      var s = e.data.species;
      if (!s) return;
      if (!(s in counts)) counts[s] = 0;
      if (e.data.event === "added") counts[s] += (e.data.count || 1);
      else if (e.data.event === "lost" || e.data.event === "removed") counts[s] -= (e.data.count || 1);
    });
    return Object.keys(counts).filter(function (k) { return counts[k] > 0; })
      .map(function (k) { return { species: k, count: counts[k] }; });
  }

  /* ================= due engine ================= */

  function quarterStart(months) {
    var now = new Date(), y = now.getFullYear();
    for (var back = 0; back < 24; back++) {
      var m = now.getMonth() - back;
      var yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12;
      if (months.indexOf(mm) !== -1) return new Date(yy, mm, 1);
    }
    return new Date(y, 0, 1);
  }
  function nextQuarterStart(months) {
    var now = new Date(), y = now.getFullYear();
    for (var f = 1; f < 24; f++) {
      var m = now.getMonth() + f;
      var yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12;
      if (months.indexOf(mm) !== -1) return new Date(yy, mm, 1);
    }
    return null;
  }

  function dues(tankId) {
    var out = { now: [], soon: [] };
    if (activeTank().status === "paused") return out;

    function rolling(label, test, interval) {
      var last = lastEntry(tankId, test);
      var d = last ? daysSince(last.ts) : null;
      if (d === null) { out.now.push({ label: label, detail: "never logged", late: true }); return; }
      if (d >= interval) out.now.push({ label: label, detail: d + "d ago", late: true });
      else if (interval - d <= 3) out.soon.push({ label: label, detail: "in " + (interval - d) + "d" });
    }

    rolling("Water change", function (e) { return e.kind === "water_change"; },
      cadenceOf(tankId, "cadence_water_change", 7));
    rolling("Glass", function (e) { return e.kind === "water_change" && e.data.glass; },
      cadenceOf(tankId, "cadence_glass", 14));
    rolling("Iodine", function (e) { return e.kind === "dose" && /iodide|iodine/.test(e.data.product); },
      cadenceOf(tankId, "cadence_iodine", 28));

    function cyclical(label, task, months) {
      var start = quarterStart(months);
      var last = lastEntry(tankId, function (e) { return e.kind === "maintenance" && e.data.task === task; });
      if (!last || new Date(last.ts) < start) {
        var wks = Math.floor((Date.now() - start) / (DAY * 7));
        out.now.push({ label: label, detail: wks + "w into cycle", late: wks > 1 });
      } else {
        var next = nextQuarterStart(months);
        if (next) {
          var days = Math.ceil((next - Date.now()) / DAY);
          if (days <= 21) out.soon.push({ label: label, detail: "in " + days + "d" });
        }
      }
    }
    cyclical("Filter & pipes", "filter_pipes", [0, 3, 6, 9]);
    cyclical("Reactor", "reactor", [0, 6]);

    return out;
  }

  /* ================= sheet rows ================= */

  function toRows(e) {
    var rows = [];
    function push(metric, value, unit) {
      rows.push({ ts: e.ts, tank: e.tank, type: e.kind, metric: metric, value: value, unit: unit || "", note: e.note || "", id: e.id });
    }
    if (e.kind === "water_change") {
      push("percent", e.data.percent, "%");
      if (e.data.refill_l) push("refill", e.data.refill_l, "L");
      if (e.data.glass) push("glass", "cleaned", "");
    } else if (e.kind === "dose") push(e.data.product, e.data.amount, e.data.unit);
    else if (e.kind === "test") {
      ["ammonia", "nitrite", "nitrate"].forEach(function (k) {
        if (e.data[k] != null) push(k, e.data[k], "ppm");
      });
    } else if (e.kind === "checker") {
      push("drop_checker", e.data.checker, "hour_" + e.data.hour);
      if (e.data.co2 != null) push("co2_elapsed", e.data.co2, "hours");
      if (e.data.light != null) push("light_elapsed", e.data.light, "hours");
    } else if (e.kind === "observation") {
      if ((e.data.behavior || []).length) push("behavior", e.data.behavior.join("|"), "");
      if (e.data.species) push("affected_" + e.data.species, e.data.count || 1, "count");
      if (!(e.data.behavior || []).length && !e.data.species) push("note", "", "");
    } else if (e.kind === "maintenance") push("task", e.data.task, "");
    else if (e.kind === "livestock") push(e.data.event + "_" + e.data.species, e.data.count, "count");
    else if (e.kind === "plant") push(e.data.event + "_" + e.data.species, 1, "count");
    else if (e.kind === "setting") push(e.data.setting, e.data.value, e.data.unit);
    else push("note", "", "");

  }

  function describe(e) {
    if (e.kind === "water_change") {
      var s = e.data.percent + "% water change";
      if (e.data.glass) s += " · glass";
      if (e.data.refill_l) s += " · " + e.data.refill_l + "L back";
      return s;
    }
    if (e.kind === "dose") return e.data.amount + " " + e.data.unit + " " + pretty(e.data.product);
    if (e.kind === "test") {
      var labels = { ammonia: "NH₃", nitrite: "NO₂", nitrate: "NO₃" };
      return ["ammonia", "nitrite", "nitrate"].filter(function (k) { return e.data[k] != null; })
        .map(function (k) { return labels[k] + " " + e.data[k]; }).join(" · ");
    }
    if (e.kind === "checker") {
      var t = "Checker " + e.data.checker + " at " + e.data.hour + ":00";
      if (e.data.co2 != null) t += " · CO₂ +" + e.data.co2 + "h";
      return t;
    }
    if (e.kind === "observation") {
      var b = (e.data.behavior || []).map(function (id) {
        for (var i = 0; i < BEHAVIOR.length; i++) if (BEHAVIOR[i].id === id) return BEHAVIOR[i].label;
        return id;
      }).join(", ");
      if (e.data.species) {
        var who = e.data.count + " " + pretty(e.data.species);
        return b ? who + " — " + b : who;
      }
      return b || "Note";
    }
    if (e.kind === "maintenance") {
      for (var i = 0; i < MAINTENANCE.length; i++) if (MAINTENANCE[i].id === e.data.task) return MAINTENANCE[i].label + " cleaned";
      return pretty(e.data.task);
    }
    if (e.kind === "livestock") return e.data.event + " · " + e.data.count + " " + pretty(e.data.species);
    if (e.kind === "plant") return e.data.event + " · " + pretty(e.data.species);
    if (e.kind === "setting") {
      if (e.data.unit === "time") return pretty(e.data.setting) + " → " + e.data.value;
      return pretty(e.data.setting) + " → " + e.data.value + " " + e.data.unit;
    }
    return "Note";
  }

    drop: [{ d: "M12 3.4c3.3 4 5.3 6.6 5.3 8.9a5.3 5.3 0 0 1-10.6 0c0-2.3 2-4.9 5.3-8.9z" }],
    glass: [{ d: "M5 4h14v11H5z" }, { d: "M8.5 19.5h7" }, { d: "M12 15v4.5" }, { d: "M8 7.5l3 3" }],
    tank: [{ d: "M4 6h16v13H4z" }, { d: "M4 12.5q4-2.6 8 0t8 0" }, { d: "M4 6h16" }],
    plus: [{ d: "M12 5v14" }, { d: "M5 12h14" }],
    clock: [{ c: [12, 12, 8.5] }, { d: "M12 7.5V12l3 1.8" }],
    book: [{ d: "M4 5.5A2 2 0 0 1 6 4h5v15.5H6a2 2 0 0 0-2 1.5z" }, { d: "M20 5.5A2 2 0 0 0 18 4h-5v15.5h5a2 2 0 0 1 2 1.5z" }]
  };

  /* ================= render ================= */

  var TABS = [
    { id: "home", label: "Tanks", ic: "tank" },
    { id: "log", label: "Log", ic: "plus" },
    { id: "history", label: "History", ic: "clock" },
    { id: "reference", label: "Reference", ic: "book" }
  ];

  var LOG_ROWS = [
    { label: "Water change", desc: "50%, dosing, glass, trim", ic: "waves", open: function () { waterChangeModal(); } },
    { label: "Drop checker", desc: "Colour and CO\u2082 window", ic: "checker", open: function () { checkerModal(); } },
    { label: "Observation", desc: "Behaviour and notes", ic: "eye", open: function () { observationModal(); } },
    { label: "Water test", desc: "Ammonia, nitrite, nitrate", ic: "vial", open: function () { testModal(); } },
    { label: "Maintenance", desc: "Filter, pipes, reactor", ic: "sparkle", open: function () { maintenanceModal(); } },
    { label: "Livestock", desc: "Added, lost, molt", ic: "fish", open: function () { livestockModal(); } },
    { label: "Plants", desc: "Added or removed", ic: "leaf", open: function () { plantModal(); } },
    { label: "Setting", desc: "Bubble rate, light", ic: "sliders", open: function () { settingModal(); } }
  ];

  function pageHead(title, sub, right) {
    var h = el("div", "pagehead");
    var top = el("div", "top");
    var left = el("div");
    left.appendChild(el("h1", null, title));
    if (sub) left.appendChild(el("div", "sub", sub));
    top.appendChild(left);
    if (right) top.appendChild(right);
    h.appendChild(top);
    return h;
  }

  function iconTile(name) {
    var t = el("div", "icontile");
    t.appendChild(svgNode(ICONS[name]));
    return t;
  }

  function render() {
    var app = $("#app");
    app.innerHTML = "";

    if (!AUTH_ON) {
      app.appendChild(el("div", "openbanner", "Sign-in is off \u2014 anyone with this URL can write."));
    }

    if (state.tab === "log") renderLog(app);
    else if (state.tab === "history") renderHistory(app, activeTank());
    else if (state.tab === "reference") renderReference(app, activeTank());
    else if (state.view === "tank") renderTank(app, activeTank());
    else renderTankList(app);

    renderTabs();
  }

  function renderTabs() {
    var nav = $("#tabs");
    nav.innerHTML = "";
    var inner = el("div", "inner");
    TABS.forEach(function (t) {
      var b = el("button");
      if (state.tab === t.id) b.setAttribute("aria-current", "page");
      b.appendChild(svgNode(ICONS[t.ic]));
      b.appendChild(el("span", null, t.label));
      b.onclick = function () {
        state.tab = t.id;
        if (t.id === "home") state.view = "list";
        persistUI();
        render();
      };
      inner.appendChild(b);
    });
    nav.appendChild(inner);
  }

  /* ---- tank list: the home screen ---- */

  function tankSummary(tank) {
    var d = dues(tank.id);
    var last = lastEntry(tank.id, function (e) { return e.kind === "water_change"; });
    var days = last ? daysSince(last.ts) : null;
    var interval = cadenceOf(tank.id, "cadence_water_change", 7);
    return {
      dues: d,
      days: days,
      interval: interval,
      late: days === null || days >= interval,
      attention: tank.status !== "paused" && d.now.length > 0
    };
  }

  function tankRow(tank) {
    var s = tankSummary(tank);
    var b = el("div", "rowcard" + (s.attention ? " attention" : ""));
    var main = el("button", "rowmain");
    main.appendChild(iconTile("tank"));

    var body = el("div", "rowbody");
    body.appendChild(el("div", "name", tank.name));
    body.appendChild(el("div", "latin", "ADA 30C"));

    var bits = [];
    if (tank.status === "paused") bits.push(tank.why || "paused");
    else {
      bits.push(s.days === null ? "no water change logged" : s.days + "d since water change");
      var ck = lastEntry(tank.id, function (e) { return e.kind === "checker"; });
      if (ck) bits.push("checker " + ck.data.checker);
    }
    body.appendChild(el("div", "meta", bits.join(" \u00b7 ")));
    main.appendChild(body);

    if (tank.status !== "paused" && s.dues.now.length) {
      var pills = el("div", "pills");
      pills.appendChild(el("div", "statuspill late", s.dues.now.length + " due"));
      main.appendChild(pills);
    }

    main.onclick = function () {
      state.active = tank.id;
      state.view = "tank";
      persistUI();
      render();
    };
    b.appendChild(main);

    // The two things most likely to be logged, one tap from the list.
    if (tank.status !== "paused") {
      var acts = el("div", "rowacts");
      [["waves", "Log water change", waterChangeModal],
       ["checker", "Log drop checker", checkerModal]].forEach(function (a) {
        var btn = el("button", "act");
        btn.setAttribute("aria-label", a[1] + ", " + tank.name);
        btn.appendChild(svgNode(ICONS[a[0]]));
        btn.onclick = function (ev) {
          ev.stopPropagation();
          state.active = tank.id;
          persistUI();
          a[2]();
        };
        acts.appendChild(btn);
      });
      b.appendChild(acts);
    }

    if (tank.status !== "paused" && s.days !== null) {
      var m = el("div", "meter");
      var fill = el("i", s.late ? "late" : "");
      fill.style.width = Math.min(s.days / s.interval, 1) * 100 + "%";
      m.appendChild(fill);
      b.appendChild(m);
    }

    return b;
  }

  function renderTankList(app) {
    var add = el("button", "datechip", "+ Tank");
    add.onclick = addTank;
    app.appendChild(pageHead("Tanks", state.tanks.length + (state.tanks.length === 1 ? " tank" : " tanks"), add));

    var needs = [], ok = [];
    state.tanks.forEach(function (t) {
      (tankSummary(t).attention ? needs : ok).push(t);
    });

    if (needs.length) {
      app.appendChild(el("div", "grouplabel", "Needs attention"));
      needs.forEach(function (t) { app.appendChild(tankRow(t)); });
    }
    if (ok.length) {
      app.appendChild(el("div", "grouplabel", needs.length ? "On track" : "All good"));
      ok.forEach(function (t) { app.appendChild(tankRow(t)); });
    }
  }

  /* ---- single tank ---- */

  function renderTank(app, tank) {
    var back = el("button", "backlink", "\u2039  Tanks");
    back.onclick = function () { state.view = "list"; persistUI(); render(); };
    app.appendChild(back);

    app.appendChild(pageHead(tank.name, tank.status === "paused" ? "Paused" : "ADA 30C \u00b7 " + (netVolume(tank.id) || "\u2014") + " L"));

    if (tank.status === "paused") {
      var pc = el("div", "paused-card");
      pc.appendChild(el("h2", null, "Not running"));
      pc.appendChild(el("p", null, tank.why || "Logging stays available."));
      app.appendChild(pc);
      return;
    }

    app.appendChild(waterFigure(tank));

    var d = dues(tank.id);
    app.appendChild(listBlock("Due", d.now, "Nothing due."));
    if (d.soon.length) app.appendChild(listBlock("Upcoming", d.soon, null));

    var recent = tankEntries(tank.id).slice(0, 5);
    var blk = el("div", "block");
    blk.appendChild(el("h2", null, "Last logged"));
    var card = el("div", "card");
    if (!recent.length) card.appendChild(el("p", "empty", "Nothing yet."));
    else recent.forEach(function (e) {
      var row = el("div", "kv");
      var lft = el("span", null, describe(e));
      row.appendChild(lft);
      row.appendChild(el("span", null, shortDate(e.ts)));
      card.appendChild(row);
    });
    blk.appendChild(card);
    app.appendChild(blk);
  }

  function waterFigure(tank) {
    var last = lastEntry(tank.id, function (e) { return e.kind === "water_change"; });
    var d = last ? daysSince(last.ts) : null;
    var interval = cadenceOf(tank.id, "cadence_water_change", 7);
    var late = d !== null && d >= interval;

    var fig = el("div", "waterfig");
    var water = el("div", "water" + (late ? " late" : ""));
    water.style.height = (d === null ? 0 : Math.min(d / interval, 1) * 70) + "%";
    water.appendChild(waveSvg(late));
    fig.appendChild(water);

    fig.appendChild(el("div", "num", d === null ? "\u2014" : String(d)));
    var cap = el("div", "cap");
    cap.textContent = d === null ? "no water change logged" :
      "days since water change \u00b7 " + (late ? "due" : "due in " + (interval - d) + "d");
    fig.appendChild(cap);
    return fig;
  }

  function listBlock(title, items, emptyText) {
    var blk = el("div", "block");
    blk.appendChild(el("h2", null, title));
    var card = el("div", "card");
    if (!items.length) card.appendChild(el("p", "empty", emptyText || "\u2014"));
    else items.forEach(function (it) {
      var row = el("div", "kv" + (it.late ? " late" : ""));
      row.appendChild(el("span", null, it.label));
      row.appendChild(el("span", null, it.detail));
      card.appendChild(row);
    });
    blk.appendChild(card);
    return blk;
  }

  /* ---- log ---- */

  function renderLog(app) {
    app.appendChild(pageHead("Log", activeTank().name));
    LOG_ROWS.forEach(function (r) {
      var b = el("button", "rowcard");
      b.appendChild(iconTile(r.ic));
      var body = el("div", "rowbody");
      body.appendChild(el("div", "name", r.label));
      body.appendChild(el("div", "rowdesc", r.desc));
      b.appendChild(body);
      b.onclick = r.open;
      app.appendChild(b);
    });
  }

  /* ---- history ---- */

  var FILTERS = [
    { id: "all", label: "All", kinds: null },
    { id: "wc", label: "Water change", kinds: ["water_change", "dose"] },
    { id: "checker", label: "Drop checker", kinds: ["checker"] },
    { id: "obs", label: "Observation", kinds: ["observation", "note"] },
    { id: "test", label: "Test", kinds: ["test"] },
    { id: "maint", label: "Maintenance", kinds: ["maintenance"] },
    { id: "life", label: "Livestock", kinds: ["livestock"] },
    { id: "plant", label: "Plants", kinds: ["plant"] },
    { id: "set", label: "Setting", kinds: ["setting"] }
  ];

  function renderHistory(app, tank) {
    app.appendChild(pageHead("History", tank.name));

    var bar = el("div", "searchbar");
    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Search entries";
    input.value = ui.search;
    input.oninput = function () {
      ui.search = input.value;
      var pos = input.selectionStart;
      render();
      var again = $("#app .searchbar input");
      if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    };
    bar.appendChild(input);
    app.appendChild(bar);

    var pills = el("div", "pillrow");
    FILTERS.forEach(function (f) {
      var b = el("button", null, f.label);
      b.setAttribute("aria-pressed", String(ui.filter === f.id));
      b.onclick = function () { ui.filter = f.id; render(); };
      pills.appendChild(b);
    });
    app.appendChild(pills);

    var active = FILTERS.filter(function (f) { return f.id === ui.filter; })[0] || FILTERS[0];
    var q = ui.search.trim().toLowerCase();
    var list = tankEntries(tank.id).filter(function (e) {
      if (active.kinds && active.kinds.indexOf(e.kind) === -1) return false;
      if (!q) return true;
      return (describe(e) + " " + (e.note || "")).toLowerCase().indexOf(q) !== -1;
    });

    if (!list.length) {
      app.appendChild(el("p", "empty", q ? "No entries match \u201c" + ui.search + "\u201d." : "Nothing logged yet."));
      return;
    }

    var day = null, card = null;
    list.forEach(function (e) {
      var dt = new Date(e.ts), key = dt.toDateString();
      if (key !== day) {
        day = key;
        var ago = daysSince(e.ts);
        app.appendChild(el("div", "daylabel",
          dt.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
          (ago === 0 ? " \u00b7 today" : ago === 1 ? " \u00b7 yesterday" : " \u00b7 " + ago + "d ago")));
        card = el("div", "card");
        app.appendChild(card);
      }
      var row = el("button", "entry");
      var head = el("div", "entryhead");
      head.appendChild(el("span", null, describe(e)));
      head.appendChild(el("span", "when", dt.toTimeString().slice(0, 5)));
      row.appendChild(head);
      if (e.note) row.appendChild(el("div", "note", e.note));
      row.onclick = function () { entryModal(e); };
      card.appendChild(row);
    });

    var link = el("button", "sheetlink", "See what goes to the sheet");
    link.style.marginTop = "24px";
    link.onclick = rowsModal;
    app.appendChild(link);
  }

  /* ---- reference ---- */

  function refBlock(title) {
    var blk = el("div", "block");
    blk.appendChild(el("h2", null, title));
    var card = el("div", "card");
    blk.appendChild(card);
    blk.card = card;
    return blk;
  }
  function kv(card, left, right, late) {
    var r = el("div", "kv" + (late ? " late" : ""));
    r.appendChild(el("span", null, left));
    r.appendChild(el("span", null, right));
    card.appendChild(r);
  }

  function tankModal(tank) {
    draft = { name: tank.name, paused: tank.status === "paused" };
    openModal("Tank", "Name and status", function (form) {
      var f = el("div", "field");
      var l = el("label", null, "Name");
      l.setAttribute("for", "tname");
      f.appendChild(l);
      var i = document.createElement("input");
      i.type = "text"; i.id = "tname"; i.value = draft.name;
      i.oninput = function () { draft.name = i.value; };
      f.appendChild(i);
      form.appendChild(f);

      var t = el("label", "toggle");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = draft.paused;
      cb.onchange = function () { draft.paused = cb.checked; };
      t.appendChild(cb);
      var d = el("div");
      d.appendChild(el("div", null, "Paused"));
      d.appendChild(el("span", "hint", "Hides dues and the water figure."));
      t.appendChild(d);
      form.appendChild(t);
    }, function () {
      var name = (draft.name || "").trim();
      if (!name) { toast("Give it a name."); return; }
      var ts = new Date().toISOString();
      var out = [];
      if (name !== tank.name) {
        tank.name = name;
        out.push({ id: uid(), ts: ts, tank: tank.id, kind: "setting",
          data: { setting: "tank_name", value: name, unit: "" }, note: "" });
      }
      var status = draft.paused ? "paused" : "running";
      if (status !== tank.status) {
        tank.status = status;
        out.push({ id: uid(), ts: ts, tank: tank.id, kind: "setting",
          data: { setting: "tank_status", value: status, unit: "" }, note: "" });
      }
      if (out.length) commit(out, "Tank updated.");
      else { closeModal(); toast("Nothing changed."); }
    }, "Save tank");
  }

  function renderReference(app, tank) {
    var edit = el("button", "datechip", "Edit tank");
    edit.onclick = function () { tankModal(tank); };
    app.appendChild(pageHead("Reference", tank.name, edit));

    var sch = schedule(tank.id);
    var b1 = refBlock("Schedule");
    var g = el("div", "grid2");
    [["CO\u2082", sch.co2On && sch.co2Off ? sch.co2On + "\u2013" + sch.co2Off + " \u00b7 " + span(sch.co2On, sch.co2Off) + "h" : "not set"],
     ["Light", sch.lightOn && sch.lightOff ? sch.lightOn + "\u2013" + sch.lightOff + " \u00b7 " + span(sch.lightOn, sch.lightOff) + "h" : "not set"],
     ["Bubble rate", settingValue(tank.id, "bubble_rate", null) ? settingValue(tank.id, "bubble_rate", null) + " bps" : "not set"],
     ["Light intensity", settingValue(tank.id, "light_intensity", null) ? settingValue(tank.id, "light_intensity", null) + " %" : "not set"],
     ["Net volume", netVolume(tank.id) ? netVolume(tank.id) + " L" : "not measured"]
    ].forEach(function (p) {
      var cell = el("div");
      cell.appendChild(el("span", "lab", p[0]));
      cell.appendChild(el("div", "val", String(p[1])));
      g.appendChild(cell);
    });
    b1.card.appendChild(g);
    app.appendChild(b1);

    var b2 = refBlock("Livestock");
    var lr = rosterOf(tank.id, "livestock");
    if (lr.length) lr.forEach(function (x) { kv(b2.card, pretty(x.species), String(x.count)); });
    else b2.card.appendChild(el("p", "empty", "Fills in as you log additions and losses."));
    app.appendChild(b2);

    var b3 = refBlock("Plants");
    var pr = rosterOf(tank.id, "plant");
    if (pr.length) pr.forEach(function (x) {
      var t = lastEntry(tank.id, function (e) { return e.kind === "plant" && e.data.event === "trim" && e.data.species === x.species; });
      kv(b3.card, pretty(x.species), t ? "trimmed " + daysSince(t.ts) + "d ago" : "no trim logged");
    });
    else b3.card.appendChild(el("p", "empty", "Add plants to get trim buttons on the water change screen."));
    app.appendChild(b3);

    var b4 = refBlock("Cadence");
    CADENCE.forEach(function (c) { kv(b4.card, c.label, "every " + cadenceOf(tank.id, c.key, c.def) + " days"); });
    kv(b4.card, "Filter & pipes", "Jan \u00b7 Apr \u00b7 Jul \u00b7 Oct");
    kv(b4.card, "Reactor", "Jan \u00b7 Jul");
    var ce = el("button", "sheetlink", "Edit intervals");
    ce.style.marginTop = "16px";
    ce.onclick = cadenceModal;
    b4.card.appendChild(ce);
    app.appendChild(b4);

    var b5 = refBlock("Last test");
    var lt = lastEntry(tank.id, function (e) { return e.kind === "test"; });
    if (lt) kv(b5.card, describe(lt), daysSince(lt.ts) + "d ago");
    else b5.card.appendChild(el("p", "empty", "No test logged yet."));
    app.appendChild(b5);

    var b6 = refBlock("API colour card");
    ["ammonia", "nitrite", "nitrate"].forEach(function (k) {
      b6.card.appendChild(el("span", "lab", k + " (ppm)"));
      var row = el("div", "swatches");
      API[k].steps.forEach(function (step, i) {
        var sw = el("div", "swatch");
        sw.style.background = API[k].colors[i];
        sw.appendChild(el("span", null, String(step)));
        row.appendChild(sw);
      });
      var w = el("div", "swatch-row");
      w.appendChild(row);
      b6.card.appendChild(w);
    });
    app.appendChild(b6);
  }

  /* ================= modal plumbing ================= */

  function openModal(title, sub, build, onSave, saveLabel, hideCancel) {
    var scrim = $("#scrim");
    scrim.innerHTML = "";
    var m = el("div", "modal");
    m.setAttribute("role", "dialog");
    m.setAttribute("aria-modal", "true");
    m.appendChild(el("h2", null, title));
    m.appendChild(el("p", "sub", sub));

    var form = el("div");
    m.appendChild(form);
    function refresh() { form.innerHTML = ""; build(form, refresh); }
    refresh();

    var actions = el("div", "modal-actions");
    var saveBtn = el("button", "save", saveLabel || "Save");
    saveBtn.onclick = onSave;
    actions.appendChild(saveBtn);
    if (!hideCancel) {
      var cancel = el("button", "cancel", "Cancel");
      cancel.onclick = closeModal;
      actions.appendChild(cancel);
    }
    m.appendChild(actions);

    scrim.appendChild(m);
    scrim.hidden = false;
    scrim.onclick = function (ev) { if (ev.target === scrim) closeModal(); };
  }

  function closeModal() {
    $("#scrim").hidden = true;
    $("#scrim").innerHTML = "";
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("#scrim").hidden) closeModal();
  });

  function labField(labelText) {
    var f = el("div", "field");
    f.appendChild(el("div", "lab", labelText));
    return f;
  }

  function whenField(form) {
    var f = el("div", "field");
    var l = el("label", null, "When");
    l.setAttribute("for", "when");
    f.appendChild(l);
    var i = document.createElement("input");
    i.type = "datetime-local";
    i.id = "when";
    i.value = draft.when;
    i.onchange = function () { draft.when = i.value; };
    f.appendChild(i);
    form.appendChild(f);
  }

  function noteField(form, labelText) {
    var f = el("div", "field");
    var l = el("label", null, labelText || "Note");
    l.setAttribute("for", "note-input");
    f.appendChild(l);
    var ta = el("textarea");
    ta.id = "note-input";
    ta.placeholder = "Optional.";
    ta.value = draft.note || "";
    ta.oninput = function () { draft.note = ta.value; };
    f.appendChild(ta);
    form.appendChild(f);
  }

  function sliderField(labelText, min, max, step, value, format, onChange) {
    var f = el("div", "field");
    var head = el("div", "slider-head");
    head.appendChild(el("div", "lab", labelText));
    var val = el("div", "slider-val", format(value));
    head.appendChild(val);
    f.appendChild(head);
    var i = document.createElement("input");
    i.type = "range";
    i.min = min; i.max = max; i.step = step; i.value = value;
    i.setAttribute("aria-label", labelText);
    i.oninput = function () { var v = Number(i.value); val.textContent = format(v); onChange(v); };
    f.appendChild(i);
    var scale = el("div", "slider-scale");
    scale.appendChild(el("span", null, format(min)));
    scale.appendChild(el("span", null, format(max)));
    f.appendChild(scale);
    return f;
  }

  function chipRow(options, selected, onToggle) {
    var row = el("div", "chips");
    options.forEach(function (o) {
      var c = el("button", "chip" + (o.flag ? " flag" : ""), o.label);
      c.setAttribute("aria-pressed", String(selected.indexOf(o.id) !== -1));
      c.onclick = function () { onToggle(o.id); };
      row.appendChild(c);
    });
    return row;
  }

  /* ---- the shared CO₂ / light / bubble panel ---- */

  function conditionsPanel(form, refresh, tankId) {
    var p = el("div", "panel");
    p.appendChild(el("div", "lab", "CO₂ and light"));

    if (draft.unlocked) {
      [["CO₂", "co2On", "co2Off"], ["Light", "lightOn", "lightOff"]].forEach(function (pair) {
        var g = el("div", "timepair");
        g.appendChild(el("span", "lab", pair[0]));
        var cols = el("div", "cols");
        [["on", pair[1]], ["off", pair[2]]].forEach(function (x) {
          var cell = el("div");
          var l = el("label", null, x[0]);
          l.setAttribute("for", x[1]);
          cell.appendChild(l);
          var i = document.createElement("input");
          i.type = "time";
          i.id = x[1];
          i.value = draft[x[1]];
          i.onchange = function () { draft[x[1]] = i.value; };
          cell.appendChild(i);
          cols.appendChild(cell);
        });
        g.appendChild(cols);
        p.appendChild(g);
      });
      p.appendChild(sliderField("Bubble rate", 0.5, 6, 0.5, draft.bubble,
        function (v) { return v + " bps"; },
        function (v) { draft.bubble = v; }));
      var done = el("button", "sheetlink", "Lock these in");
      done.onclick = function () { draft.unlocked = false; refresh(); };
      p.appendChild(done);
    } else {
      [["CO₂", draft.co2On, draft.co2Off], ["Light", draft.lightOn, draft.lightOff]].forEach(function (x) {
        var r = el("div", "winrow");
        r.appendChild(el("span", null, x[0]));
        r.appendChild(el("span", null, x[1] && x[2] ? x[1] + " – " + x[2] : "not set"));
        p.appendChild(r);
      });
      var br = el("div", "winrow");
      br.appendChild(el("span", null, "Bubble rate"));
      br.appendChild(el("span", null, draft.bubble ? draft.bubble + " bps" : "not set"));
      p.appendChild(br);

      var lock = el("div", "locked");
      lock.appendChild(el("em", null, "locked to last logged"));
      var ed = el("button", "sheetlink", "Change");
      ed.onclick = function () { draft.unlocked = true; refresh(); };
      lock.appendChild(ed);
      p.appendChild(lock);
    }
    form.appendChild(p);
  }

  function loadConditions(tankId) {
    var s = schedule(tankId);
    draft.co2On = s.co2On; draft.co2Off = s.co2Off;
    draft.lightOn = s.lightOn; draft.lightOff = s.lightOff;
    draft.bubble = Number(settingValue(tankId, "bubble_rate", 2));
    draft.unlocked = false;
  }

  function conditionEntries(tankId, ts) {
    var cur = schedule(tankId, ts);
    var out = [];
    [["co2On", "co2_on"], ["co2Off", "co2_off"], ["lightOn", "light_on"], ["lightOff", "light_off"]]
      .forEach(function (x) {
        if (draft[x[0]] && draft[x[0]] !== cur[x[0]]) {
          out.push({ id: uid(), ts: ts, tank: tankId, kind: "setting",
            data: { setting: x[1], value: draft[x[0]], unit: "time" }, note: "" });
        }
      });
    var curBubble = Number(settingValue(tankId, "bubble_rate", null, ts));
    if (draft.bubble && draft.bubble !== curBubble) {
      out.push({ id: uid(), ts: ts, tank: tankId, kind: "setting",
        data: { setting: "bubble_rate", value: draft.bubble, unit: "bps" }, note: "" });
    }
    return out;
  }

  /* ================= water change ================= */

  function waterChangeModal() {
    var tank = activeTank();
    var lastFert = lastEntry(tank.id, function (e) { return e.kind === "dose" && e.data.unit === "pumps"; });
    var lastIod = lastEntry(tank.id, function (e) { return e.kind === "dose" && /iodide|iodine/.test(e.data.product); });
    var iodDays = lastIod ? daysSince(lastIod.ts) : 999;
    var iodProduct = lastIod ? lastIod.data.product : "seachem_reef_iodide";
    var suggested = suggestedDose(tank.id, iodProduct);

    draft = {
      when: nowLocal(),
      percent: 50,
      refill: "",
      dose: true,
      fertProduct: lastFert ? lastFert.data.product : "tropica_premium",
      pumps: lastFert ? lastFert.data.amount : 3,
      iodine: iodDays >= cadenceOf(tank.id, "cadence_iodine", 28),
      iodProduct: iodProduct,
      iodAmount: lastIod ? lastIod.data.amount : 0.5,
      glass: true,
      trims: [],
      note: ""
    };
    loadConditions(tank.id);

    openModal("Water change", tank.name, function (form, refresh) {
      whenField(form);

      form.appendChild(sliderField("Percent", 20, 80, 10, draft.percent,
        function (v) { return v + "%"; },
        function (v) { draft.percent = v; }));

      // three icon switches
      var sw = el("div", "switches");
      [
        { key: "dose", label: "Dosing", ic: "drop" },
        { key: "iodine", label: "Iodine", ic: "vial" },
        { key: "glass", label: "Glass", ic: "glass" }
      ].forEach(function (s) {
        var b = el("button", "switch");
        b.setAttribute("aria-pressed", String(!!draft[s.key]));
        b.appendChild(svgNode(ICONS[s.ic]));
        b.appendChild(el("b", null, s.label));
        b.onclick = function () { draft[s.key] = !draft[s.key]; refresh(); };
        sw.appendChild(b);
      });
      form.appendChild(sw);

      if (draft.dose) {
        var fp = el("div", "panel");
        fp.appendChild(el("div", "lab", pretty(draft.fertProduct)));
        fp.appendChild(sliderField("Pumps", 1, 4, 0.5, draft.pumps,
          function (v) { return v + (v === 1 ? " pump" : " pumps"); },
          function (v) { draft.pumps = v; }));
        if (draft.editingProduct) {
          var pi = document.createElement("input");
          pi.type = "text";
          pi.value = pretty(draft.fertProduct);
          pi.setAttribute("aria-label", "Fertiliser name");
          pi.oninput = function () { draft.fertProduct = slug(pi.value); };
          fp.appendChild(pi);
        } else {
          var swap = el("button", "sheetlink", "Switched fertiliser?");
          swap.onclick = function () { draft.editingProduct = true; refresh(); };
          fp.appendChild(swap);
        }
        form.appendChild(fp);
      }

      if (draft.iodine) {
        var ip = el("div", "panel");
        ip.appendChild(el("div", "lab", pretty(draft.iodProduct)));
        ip.appendChild(sliderField("Amount", 0.25, 3, 0.25, draft.iodAmount,
          function (v) { return v + " ml"; },
          function (v) { draft.iodAmount = v; refreshMath(); }));

        var math = el("p", "mathline");
        ip.appendChild(math);
        function refreshMath() {
          var vol = netVolume(tank.id);
          var sug = suggestedDose(tank.id, draft.iodProduct);
          if (!vol) { math.className = "mathline"; math.textContent = "no volume measured — log refill litres to enable the check"; return; }
          if (sug == null) { math.className = "mathline"; math.textContent = "no dose rule set for this product"; return; }
          var over = draft.iodAmount / sug;
          math.className = "mathline" + (over > 2 ? " off" : "");
          math.textContent = "label math for " + vol + " L: " + sug + " ml" +
            (over > 2 ? "  ·  you're at " + (Math.round(over * 10) / 10) + "×" : "");
        }
        refreshMath();
        form.appendChild(ip);
      }

      // trim
      var plants = rosterOf(tank.id, "plant").map(function (p) {
        var t = lastEntry(tank.id, function (e) {
          return e.kind === "plant" && e.data.event === "trim" && e.data.species === p.species;
        });
        p.since = t ? daysSince(t.ts) : 9999;
        return p;
      }).sort(function (a, b) { return b.since - a.since; });
      var tf = labField("Trimmed");
      if (plants.length) {
        tf.appendChild(chipRow(
          plants.map(function (p) {
            return { id: p.species, label: pretty(p.species) + (p.since < 9999 ? " · " + p.since + "d" : "") };
          }),
          draft.trims,
          function (id) {
            var i = draft.trims.indexOf(id);
            if (i === -1) draft.trims.push(id); else draft.trims.splice(i, 1);
            refresh();
          }
        ));
      } else {
        tf.appendChild(el("p", "mathline", "No plants logged yet — add them from the Plants tile."));
      }
      form.appendChild(tf);

      conditionsPanel(form, refresh, tank.id);

      var rf = el("div", "field");
      var rl = el("label", null, "Litres put back (optional)");
      rl.setAttribute("for", "refill");
      rf.appendChild(rl);
      var ri = document.createElement("input");
      ri.type = "number";
      ri.id = "refill";
      ri.step = "0.5";
      ri.min = "0";
      ri.placeholder = "Measure once and net volume fills itself in";
      ri.value = draft.refill;
      ri.oninput = function () { draft.refill = ri.value; };
      rf.appendChild(ri);
      form.appendChild(rf);

      noteField(form);
    }, function () {
      var ts = fromLocal(draft.when);
      var id = state.active;
      var out = conditionEntries(id, ts);

      var wc = { id: uid(), ts: ts, tank: id, kind: "water_change",
        data: { percent: draft.percent, glass: !!draft.glass }, note: draft.note || "" };
      if (draft.refill) wc.data.refill_l = Number(draft.refill);
      out.push(wc);

      if (draft.dose) out.push({ id: uid(), ts: ts, tank: id, kind: "dose",
        data: { product: draft.fertProduct, amount: draft.pumps, unit: "pumps" }, note: "" });
      if (draft.iodine) out.push({ id: uid(), ts: ts, tank: id, kind: "dose",
        data: { product: draft.iodProduct, amount: draft.iodAmount, unit: "ml" }, note: "" });

      draft.trims.forEach(function (sp) {
        out.push({ id: uid(), ts: ts, tank: id, kind: "plant",
          data: { event: "trim", species: sp }, note: "" });
      });

      if (draft.refill && draft.percent) {
        var derived = Math.round(Number(draft.refill) / (draft.percent / 100));
        if (derived !== Number(settingValue(id, "net_volume_l", null))) {
          out.push({ id: uid(), ts: ts, tank: id, kind: "setting",
            data: { setting: "net_volume_l", value: derived, unit: "L" }, note: "derived from refill" });
        }
      }

      commit(out, "Water change logged.");
    }, "Log it");
  }

  /* ================= drop checker ================= */

  function checkerModal() {
    var tank = activeTank();
    draft = { when: nowLocal(), checker: null, note: "" };
    loadConditions(tank.id);

    openModal("Drop checker", tank.name, function (form, refresh) {
      var f = labField("Colour you're reading");
      var pick = el("div", "picker");
      CHECKER.forEach(function (c) {
        var b = el("button");
        b.setAttribute("aria-pressed", String(draft.checker === c.id));
        var blob = el("div", "blob");
        blob.style.background = c.color;
        b.appendChild(blob);
        b.appendChild(el("b", null, c.label));
        b.appendChild(el("i", null, c.hint));
        b.onclick = function () { draft.checker = c.id; refresh(); };
        pick.appendChild(b);
      });
      f.appendChild(pick);
      form.appendChild(f);

      whenField(form);
      conditionsPanel(form, refresh, tank.id);

      var when = new Date(fromLocal(draft.when));
      var co2 = elapsed(draft.co2On, draft.co2Off, when);
      var c2 = el("div", "caution");
      c2.innerHTML = co2 != null
        ? "<strong>" + co2 + "h into the CO₂ window.</strong> The checker lags one to two hours, so this colour reflects roughly " + Math.max(0, co2 - 2) + "h to " + Math.max(0, co2 - 1) + "h in."
        : "<strong>Outside the CO₂ window.</strong> Recorded as such — the reading still logs.";
      form.appendChild(c2);

      noteField(form);
    }, function () {
      if (!draft.checker) { toast("Pick a colour."); return; }
      var ts = fromLocal(draft.when);
      var when = new Date(ts);
      var out = conditionEntries(state.active, ts);
      out.push({ id: uid(), ts: ts, tank: state.active, kind: "checker",
        data: {
          checker: draft.checker, hour: when.getHours(),
          co2: elapsed(draft.co2On, draft.co2Off, when),
          light: elapsed(draft.lightOn, draft.lightOff, when)
        }, note: draft.note || "" });
      commit(out, "Checker logged.");
    }, "Log reading");
  }

  /* ================= other entries ================= */

  function testModal() {
    draft = { when: nowLocal(), ammonia: null, nitrite: null, nitrate: null, note: "" };
    openModal("Water test", activeTank().name + " · match the colour you read", function (form, refresh) {
      ["ammonia", "nitrite", "nitrate"].forEach(function (k) {
        var f = labField(k + " (ppm)");
        var row = el("div", "swatches");
        API[k].steps.forEach(function (step, i) {
          var b = el("button", "swatch");
          b.style.background = API[k].colors[i];
          b.setAttribute("aria-pressed", String(draft[k] === step));
          b.setAttribute("aria-label", k + " " + step + " ppm");
          b.appendChild(el("span", null, String(step)));
          b.onclick = function () { draft[k] = step; refresh(); };
          row.appendChild(b);
        });
        var w = el("div", "swatch-row");
        w.appendChild(row);
        f.appendChild(w);
        form.appendChild(f);
      });
      whenField(form);
      noteField(form);
    }, function () {
      if (draft.ammonia === null && draft.nitrite === null && draft.nitrate === null) {
        toast("Pick at least one value."); return;
      }
      commit([{ id: uid(), ts: fromLocal(draft.when), tank: state.active, kind: "test",
        data: { ammonia: draft.ammonia, nitrite: draft.nitrite, nitrate: draft.nitrate },
        note: draft.note || "" }], "Test logged.");
    });
  }

  function observationModal(existing) {
    draft = existing
      ? { when: toLocal(existing.ts), behavior: (existing.data.behavior || []).slice(),
          species: existing.data.species || "", count: existing.data.count || 1, note: existing.note || "" }
      : { when: nowLocal(), behavior: [], species: "", count: 1, note: "" };

    openModal("Observation", activeTank().name, function (form, refresh) {
      var f = labField("Behaviour");
      f.appendChild(chipRow(BEHAVIOR, draft.behavior, function (id) {
        var i = draft.behavior.indexOf(id);
        if (i === -1) draft.behavior.push(id); else draft.behavior.splice(i, 1);
        refresh();
      }));
      form.appendChild(f);

      var roster = rosterOf(activeTank().id, "livestock");
      var f2 = labField("Who");
      if (roster.length) {
        f2.appendChild(chipRow(
          roster.map(function (r) { return { id: r.species, label: pretty(r.species) }; }),
          draft.species ? [draft.species] : [],
          function (id) { draft.species = draft.species === id ? "" : id; refresh(); }
        ));
      } else {
        f2.appendChild(el("p", "mathline", "Log livestock to pick a species here."));
      }
      form.appendChild(f2);

      if (draft.species) {
        var max = 1;
        roster.forEach(function (r) { if (r.species === draft.species) max = Math.max(r.count, 1); });
        form.appendChild(sliderField("How many affected", 1, max, 1, Math.min(draft.count, max),
          function (v) { return v + " of " + max; },
          function (v) { draft.count = v; }));
      }

      noteField(form, "What you saw");
      whenField(form);
    }, function () {
      if (!draft.behavior.length && !draft.note.trim() && !draft.species) { toast("Nothing to log yet."); return; }
      var data = { behavior: draft.behavior };
      if (draft.species) { data.species = draft.species; data.count = draft.count; }
      var entry = { id: existing ? existing.id : uid(), ts: fromLocal(draft.when),
        tank: state.active, kind: "observation", data: data, note: draft.note || "" };
      if (existing) replaceEntry(entry, "Observation updated.");
      else commit([entry], "Observation logged.");
    });
  }

  function settingModal() {
    draft = { when: nowLocal(), setting: null, value: "", note: "" };
    var recent = tankEntries(state.active).filter(function (e) {
      return e.kind === "setting" && e.data.unit !== "days" && daysSince(e.ts) <= 14;
    });

    openModal("Setting change", activeTank().name, function (form, refresh) {
      if (recent.length) {
        var c = el("div", "caution");

          " " + daysSince(r.ts) + " days ago. A second change now makes the next observation ambiguous.";
        form.appendChild(c);

      var f = labField("What changed");
      f.appendChild(chipRow(SETTINGS.map(function (s) { return { id: s.id, label: s.label }; }),

      form.appendChild(f);

      if (draft.setting) {
        var spec = SETTINGS.filter(function (s) { return s.id === draft.setting; })[0];
        var current = Number(settingValue(state.active, spec.id, spec.min));
        if (draft.value === "") draft.value = current;
        form.appendChild(sliderField("New value", spec.min, spec.max, spec.step, draft.value,

          function (v) { draft.value = v; }));

      whenField(form);
      noteField(form);

      commit([{ id: uid(), ts: fromLocal(draft.when), tank: state.active, kind: "setting",
        data: { setting: draft.setting, value: Number(draft.value), unit: spec.unit },
        note: draft.note || "" }], "Setting change logged.");
    });

  function cadenceModal() {
    var tank = activeTank();
    draft = { when: nowLocal() };
    CADENCE.forEach(function (c) { draft[c.key] = cadenceOf(tank.id, c.key, c.def); });

    openModal("Intervals", tank.name + " · when things get flagged", function (form) {
      CADENCE.forEach(function (c) {
        form.appendChild(sliderField(c.label, 1, 60, 1, draft[c.key],
          function (v) { return v + "d"; },
          function (v) { draft[c.key] = v; }));
      });
      var n = el("div", "caution");
      n.innerHTML = "<strong>Filter, pipes and reactor aren't intervals.</strong> They're anchored to the first week of their months, so there's nothing to set.";
      form.appendChild(n);
    }, function () {
      var ts = new Date().toISOString();
      var out = [];
      CADENCE.forEach(function (c) {
        if (draft[c.key] !== cadenceOf(tank.id, c.key, c.def)) {
          out.push({ id: uid(), ts: ts, tank: tank.id, kind: "setting",
            data: { setting: c.key, value: draft[c.key], unit: "days" }, note: "" });
        }
      });
      if (out.length) commit(out, "Intervals updated.");
      else { closeModal(); toast("Nothing changed."); }
    }, "Save intervals");
  }

  function entryModal(entry) {
    draft = { when: toLocal(entry.ts), note: entry.note || "" };
    openModal(describe(entry), new Date(entry.ts).toLocaleString(), function (form) {
      whenField(form);
      noteField(form);
      if (entry.kind === "observation") {
        var edit = el("button", "sheetlink", "Edit behaviour and species");
        edit.onclick = function () { observationModal(entry); };
        form.appendChild(edit);
      }
      var del = el("button", "danger", "Delete this entry");
      del.style.marginTop = "20px";
      del.onclick = function () { removeEntry(entry); };
      form.appendChild(del);
    }, function () {
      var next = {
        id: entry.id, ts: fromLocal(draft.when), tank: entry.tank,
        kind: entry.kind, data: entry.data, note: draft.note || ""
      };
      replaceEntry(next, "Entry updated.");
    }, "Save changes");
  }

  function rowsModal() {
    openModal("Sheet rows", "One row per reading. Append-only.", function (form) {
      var p = el("p", "mathline", "Adding a metric later adds rows, not columns — no migration.");
      form.appendChild(p);

      var rows = [];
      state.entries.slice()
        .sort(function (a, b) { return new Date(b.ts) - new Date(a.ts); })
        .slice(0, 14)
        .forEach(function (e) { rows = rows.concat(toRows(e)); });

      var sc = el("div", "scroller");
      var table = el("table", "rows");
      var thead = el("thead"), htr = el("tr");
      ["Timestamp", "Tank", "Event Type", "Metric", "Value", "Unit", "Note"].forEach(function (h) {
        htr.appendChild(el("th", null, h));
      });
      thead.appendChild(htr);
      table.appendChild(thead);
      var tb = el("tbody");
      rows.forEach(function (r) {
        var tr = el("tr");
        [new Date(r.ts).toISOString().slice(0, 16).replace("T", " "), r.tank, r.type, r.metric, String(r.value), r.unit, r.note]
          .forEach(function (v) { tr.appendChild(el("td", null, v)); });
        tb.appendChild(tr);
      });
      table.appendChild(tb);
      sc.appendChild(table);
      form.appendChild(sc);
    }, closeModal, "Close", true);
  }

  function addTank() {
    draft = { name: "" };
    openModal("Add a tank", "It'll show up in the switcher.", function (form) {
      var f = el("div", "field");
      var l = el("label", null, "Name");
      l.setAttribute("for", "tn");
      f.appendChild(l);
      var i = document.createElement("input");
      i.type = "text"; i.id = "tn"; i.placeholder = "Tank 3";
      i.oninput = function () { draft.name = i.value; };
      f.appendChild(i);
      form.appendChild(f);
    }, function () {
      var name = (draft.name || "").trim();
      if (!name) { toast("Give it a name."); return; }
      var id = "t" + Date.now().toString(36).slice(-5);
      state.tanks.push({ id: id, name: name, status: "running" });
      state.active = id;
      state.view = "tank";
      persistUI();
      commit([{ id: uid(), ts: new Date().toISOString(), tank: id, kind: "setting",
        data: { setting: "tank_name", value: name, unit: "" }, note: "" }], name + " added.");
    }, "Add tank");
  }

  /* ================= boot ================= */

  /* ================= sign-in gate ================= */

  function showGate(message) {
    var app = document.getElementById("app");
    app.innerHTML = "";
    var card = el("div", "gate");
    card.appendChild(el("h2", null, "Aquascape Log"));
    card.appendChild(el("p", null, "Sign in with the Google account that owns the sheet."));
    var btn = el("div", "btn");
    btn.id = "gbtn";
    card.appendChild(btn);
    if (message) card.appendChild(el("p", "err", message));
    app.appendChild(card);
    document.getElementById("tabs").innerHTML = "";
    initGis();
  }

  function initGis() {
    if (!window.google || !window.google.accounts || !window.google.accounts.id) {
      return setTimeout(initGis, 150);
    }
    window.google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: function (resp) {
        idToken = resp.credential;
        try { sessionStorage.setItem(TOKEN_KEY, idToken); } catch (err) {}
        // Ask the server whether sign-in is configured, then start.
  fetch("/api/config")
    .then(function (r) { return r.json(); })
    .then(function (cfg) {
      CLIENT_ID = String(cfg.clientId || "").trim();
      AUTH_ON = CLIENT_ID.indexOf("apps.googleusercontent.com") !== -1;
    })
    .catch(function () { AUTH_ON = false; })
    .then(function () { start(); });
      }
    });
    var host = document.getElementById("gbtn");
    if (host) {
      window.google.accounts.id.renderButton(host, {
        theme: "outline", size: "large", shape: "pill", text: "signin_with"
      });
    }
  }

  function showError(err) {
    var app = document.getElementById("app");
    app.innerHTML = "";
    var card = el("div", "paused-card");
    card.appendChild(el("h2", null, "Can't reach the sheet"));
    card.appendChild(el("p", null, String(err && err.message ? err.message : err)));
    var b = el("button", "primary", "Try again");
    b.style.marginTop = "18px";
    b.onclick = function () { location.reload(); };
    card.appendChild(b);
    app.appendChild(card);
  }

  function start() {
    if (AUTH_ON && !idToken) {
      try { idToken = sessionStorage.getItem(TOKEN_KEY); } catch (err) { idToken = null; }
    }
    if (AUTH_ON && !idToken) return showGate();

    load().then(function (s) {
      state = s;
      render();
      flushQueue();
    }).catch(function (err) {
      // ID tokens last an hour, so expiry is routine rather than a failure.
      if (AUTH_ON && (String(err.message) === "auth" || /token|signed in|allowed/.test(String(err.message)))) {
        idToken = null;
        try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
        return showGate(String(err.message) === "auth" ? "" : err.message);
      }
      showError(err);
    });
  }

  // Ask the server whether sign-in is configured, then start.
  fetch("/api/config")
    .then(function (r) { return r.json(); })
    .then(function (cfg) {
      CLIENT_ID = String(cfg.clientId || "").trim();
      AUTH_ON = CLIENT_ID.indexOf("apps.googleusercontent.com") !== -1;
    })
    .catch(function () { AUTH_ON = false; })
    .then(function () { start(); });

})();
</script>
